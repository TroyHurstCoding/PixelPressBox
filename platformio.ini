; PixelPressbox firmware for the Seengreat RGB Matrix HUB75 S3 (ESP32-S3-WROOM-1-N16R8)
;
;   pio run -t upload        -> flash the firmware
;   pio run -t uploadfs      -> copy data/ (config.json + sounds) to the board
;   pio device monitor       -> watch the log

[env:pixelpressbox]
; Pinned: "stable" moved to Arduino core 4.0 on 2026-11-19. Change these on purpose, then rebuild and test.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; 16 MB quad flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
extra_scripts = pre:tools/gzip_webpage.py

lib_deps =
  ; pinned commits (zip downloads, so no git client is needed); minimp3 is vendored in lib/
  https://github.com/adafruit/Adafruit_BusIO/archive/3b8364267c3ee6e16bad91bc2101aefbd5b5915f.zip
  https://github.com/adafruit/Adafruit-GFX-Library/archive/f256ef6b0f248711a0cd354be0da5ccd224808c3.zip
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA/archive/7f5e9cf8ad57c40a0c1392f5e91db7d143b7212a.zip
  https://github.com/bblanchon/ArduinoJson/archive/1cd478f48e7c4cd142a0bd26ee17d63d70d04e3f.zip
  https://github.com/tzapu/WiFiManager/archive/4131fe617d01d746677e8b909379597162c2ca58.zip
  https://github.com/bitbank2/AnimatedGIF/archive/17a6a2eda4385c14f39ee51adfc89ab721150527.zip
  https://github.com/bitbank2/PNGdec/archive/7ef2a0924d01e521352ea000fe20926d0cc99c85.zip
  https://github.com/bitbank2/JPEGDEC/archive/ff585f2fd2bdc2c5776a368aaae818071e1b60a5.zip
