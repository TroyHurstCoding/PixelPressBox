; PixelPressbox firmware for the Seengreat RGB Matrix HUB75 S3 (ESP32-S3-WROOM-1-N16R8)
;
;   pio run -t upload        -> flash the firmware
;   pio run -t uploadfs      -> copy data/ (config.json + sounds) to the board
;   pio device monitor       -> watch the log

[env:pixelpressbox]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; 16 MB quad flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  https://github.com/adafruit/Adafruit_BusIO.git
  https://github.com/adafruit/Adafruit-GFX-Library.git
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
  https://github.com/bblanchon/ArduinoJson.git
  https://github.com/schreibfaul1/ESP32-audioI2S.git
  https://github.com/tzapu/WiFiManager.git
  https://github.com/bitbank2/AnimatedGIF.git
  https://github.com/bitbank2/PNGdec.git
  https://github.com/bitbank2/JPEGDEC.git
